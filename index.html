<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XASA Labs · eXtreme Advanced Strategy Arts</title>
    <meta name="description" content="XASA Labs: giochi di strategia. Il primo è XASA History Game, i grandi della storia si sfidano." />
    <meta name="theme-color" content="#0B1328" />

    <!-- Favicon: SVG per i browser moderni, PNG per gli altri, icona per iPhone e per Android -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <style>
      :root {
        color-scheme: dark;
        --sfondo: #0b1328;
        --testo: #e6eeff;
        --tenue: #8fa6cf;
        --ciano: #2be0ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, #13245a 0%, var(--sfondo) 60%);
        color: var(--testo);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 32px 20px;
      }
      main {
        max-width: 720px;
      }
      .logo {
        width: min(640px, 100%);
        height: auto;
      }
      .motto {
        margin: 12px 0 40px;
        font-size: 0.85rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--tenue);
      }
      .gioco {
        display: inline-block;
        padding: 18px 28px;
        border: 1px solid rgba(43, 224, 255, 0.35);
        border-radius: 14px;
        color: var(--testo);
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s;
      }
      .gioco:hover,
      .gioco:focus-visible {
        border-color: var(--ciano);
        background: rgba(43, 224, 255, 0.06);
      }
      .gioco small {
        display: block;
        color: var(--tenue);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .gioco strong {
        font-size: 1.2rem;
      }
      footer {
        margin-top: 48px;
        font-size: 0.8rem;
        color: var(--tenue);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="margin: 0">
        <img class="logo" src="/logo.svg" alt="XASA Labs" width="826" height="216" />
      </h1>
      <p class="motto">eXtreme Advanced Strategy Arts</p>

      <a class="gioco" href="https://historycard.onrender.com">
        <small>Il nostro primo gioco</small>
        <strong>XASA History Game →</strong>
      </a>

      <footer>© 2026 XASA Labs</footer>
    </main>
  </body>
</html>
